[package]
name = "agent-cost-monitor-window"
version = "0.1.0"
description = "Always-on-top spend window for AI coding agents"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png so the window can carry a large icon: the taskbar draws a running window's own
# icon, and the default one comes from the 32x32 PNG in bundle.icon — a 32px image rendered
# into a 48px slot is upscaled, which is what made it look blurred.
tauri = { version = "2", features = ["image-png"] }
# Read directly rather than through a hand-rolled scan of the JSON: the window has to find its own
# port and geometry when Explorer started it, because Explorer cannot carry the launcher's
# environment with it — and the hand-off through Explorer exists because a process started by a
# host hook cannot create a WebView2 window at all.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
